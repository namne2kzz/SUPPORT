# Backing services for local SUPPORT (NMate) development.
# Run:   docker compose up -d        (start in background)
# Reset: docker compose down -v       (wipe the vector database)
#
# The API itself runs natively: `dotnet run --project src/SUPPORT.Api` (http://localhost:5160).
# The LLM is Gemini (cloud API) — there is no model container.

services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: support-pgvector
    environment:
      POSTGRES_USER: "${SUPPORT_PG_USER:-support}"
      POSTGRES_PASSWORD: "${SUPPORT_PG_PASSWORD}"
      POSTGRES_DB: support
    ports:
      - "5433:5432"   # 5432 is taken by hub-postgres
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPPORT_PG_USER:-support}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Web DB admin for the NMate database → http://localhost:8048 (DASHBOARD's own DbGate stays on 8047).
  dbgate:
    image: dbgate/dbgate:latest
    container_name: support-dbgate
    ports:
      - "8048:3000"
    environment:
      CONNECTIONS: con1
      LABEL_con1: "NMate (PostgreSQL + pgvector)"
      SERVER_con1: pgvector
      PORT_con1: 5432
      USER_con1: "${SUPPORT_PG_USER:-support}"
      PASSWORD_con1: "${SUPPORT_PG_PASSWORD}"
      DATABASE_con1: support
      ENGINE_con1: postgres@dbgate-plugin-postgres
    volumes:
      - dbgate-data:/root/.dbgate
    depends_on:
      pgvector:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgvector-data:
  dbgate-data:
