name: CI

on:
  # Feature branches are covered by the pull_request trigger, so pushing to one
  # does not build twice. Direct pushes to main still build on their own.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on rapid pushes to the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    # Integration tests need a real PostgreSQL with pgvector + unaccent. Testcontainers is not used
    # (blocked on the dev machine), so CI provides the same server as docker-compose.yml.
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SUPPORT.slnx

      - name: Build
        run: dotnet build SUPPORT.slnx --configuration Release --no-restore

      # Unit tests: fast, no external dependencies. KnowledgeFilesLintTests skips itself because
      # SUPPORT_KNOWLEDGE_DIR is unset — the DASHBOARD repo lints its own Knowledge/ folder.
      - name: Unit tests
        run: >
          dotnet test tests/SUPPORT.UnitTests/SUPPORT.UnitTests.csproj
          --configuration Release --no-build --verbosity normal

      # Each run creates (and drops) its own support_test_<guid> database on the service container.
      # No Gemini key is needed: the API factory swaps in fake chat/embedding clients.
      - name: Integration tests
        env:
          SUPPORT_TEST_DB: "Host=localhost;Port=5432;Username=support;Password=support-ci;Database=postgres"
        run: >
          dotnet test tests/SUPPORT.IntegrationTests/SUPPORT.IntegrationTests.csproj
          --configuration Release --no-build --verbosity normal

  docker-image:
    name: Docker image
    needs: backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/SUPPORT.Api/Dockerfile
          tags: support-api:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=support-api
          cache-to: type=gha,scope=support-api,mode=max
